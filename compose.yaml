name: agent-tasks

# This is the local/E2E stack. It builds api, worker and browser-runner from the
# repository, so those services pin `pull_policy: build`: a pull -- explicit or
# the default `missing` on a cold cache -- would otherwise run a stale published
# tag instead of the checkout. deployment/compose.production.yaml has no `build`
# and pulls the released images instead.

# Stamped on every container so a running stack is identifiable from
# `docker ps` / `docker inspect`, independently of the compose project name.
x-stack-label: &stack-label
  com.agent-tasks.stack: ${STACK_NAME:-compose}

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-agent}@postgres:5432/${POSTGRES_DB:-agent_tasks}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
  AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
  SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:?set SECRETS_ENCRYPTION_KEY in .env}
  # Optional when ADMIN_EMAIL/ADMIN_PASSWORD bootstrap the first admin.
  SETUP_TOKEN: ${SETUP_TOKEN:-}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  ADMIN_NAME: ${ADMIN_NAME:-Administrator}
  ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
  OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:-}
  OPENCODE_GO_BASE_URL: ${OPENCODE_GO_BASE_URL:-}
  OPENCODE_GO_MODEL: ${OPENCODE_GO_MODEL:-}
  OPENCODE_GO_MODELS: ${OPENCODE_GO_MODELS:-}
  OPENCODE_GO_NAME: ${OPENCODE_GO_NAME:-OpenCode Go}
  AGENT_TASKS_ENABLE_CODEX: ${AGENT_TASKS_ENABLE_CODEX:-0}
  SMTP_URL: ${SMTP_URL:-}
  SMTP_FROM: ${SMTP_FROM:-}
  SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  RATE_LIMIT_SIGNIN_MAX: ${RATE_LIMIT_SIGNIN_MAX:-5}
  RATE_LIMIT_SESSION_MAX: ${RATE_LIMIT_SESSION_MAX:-600}
  RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
  TRUST_PROXY: ${TRUST_PROXY:-true}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:17.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent}
      POSTGRES_DB: ${POSTGRES_DB:-agent_tasks}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent} -d ${POSTGRES_DB:-agent_tasks}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    labels:
      <<: *stack-label

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: ${IMAGE_PREFIX:-ghcr.io/all-the-rest/agent-tasks}/api:${IMAGE_TAG:-latest}
    pull_policy: build
    restart: unless-stopped
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "true"
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    ports:
      # Loopback by default: the TLS proxy is the only public listener. Set
      # HTTP_BIND=0.0.0.0 only when the proxy runs on another host/container.
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    read_only: true
    tmpfs: [/tmp]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      <<: *stack-label
      com.centurylinklabs.watchtower.enable: "true"

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: ${IMAGE_PREFIX:-ghcr.io/all-the-rest/agent-tasks}/api:${IMAGE_TAG:-latest}
    pull_policy: build
    restart: unless-stopped
    command: ["node", "apps/worker/dist/index.js"]
    environment:
      <<: *app-env
      RUNNER_URL: http://browser-runner:8081
      RUNNER_TOKEN: ${RUNNER_TOKEN:?set RUNNER_TOKEN in .env}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      CODEX_HOME_ROOT: /var/lib/agent-tasks/codex
      CODEX_ISOLATED_RUNNER: ${CODEX_ISOLATED_RUNNER:-0}
      OPENCODE_RUNTIME_ENABLED: ${OPENCODE_RUNTIME_ENABLED:-0}
      OPENCODE_PROVISIONER_URL: http://opencode-provisioner:4090
      OPENCODE_PROVISIONER_TOKEN: ${OPENCODE_PROVISIONER_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      browser-runner:
        condition: service_started
    networks: [backend, opencode, opencode-runtime]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      # One login directory per user for the opt-in Codex adapter (owner id subdirectory).
      - codex-homes:/var/lib/agent-tasks/codex
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    labels:
      <<: *stack-label
      com.centurylinklabs.watchtower.enable: "true"
    stop_grace_period: 40s

  # OpenCode V2 owns agent sessions/tool orchestration. It is a separate,
  # version-pinned image on a worker-only network; it has no database, browser,
  # host filesystem, Docker socket, or public port.
  opencode:
    build:
      context: .
      dockerfile: docker/Dockerfile.opencode
      args:
        OPENCODE_VERSION: ${OPENCODE_VERSION:-2.2.5}
    image: ${IMAGE_PREFIX:-ghcr.io/all-the-rest/agent-tasks}/opencode:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      OPENCODE_SERVER_USERNAME: opencode
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?set OPENCODE_SERVER_PASSWORD in .env}
    volumes:
      - opencode-data:/home/opencode/.local/share/opencode
    networks: [opencode]
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /home/opencode/.cache:size=128m,mode=0700,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: ${OPENCODE_MEMORY_LIMIT:-1g}
    cpus: ${OPENCODE_CPUS:-1.0}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error --user \"$${OPENCODE_SERVER_USERNAME}:$${OPENCODE_SERVER_PASSWORD}\" http://127.0.0.1:4096/api/info >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      <<: *stack-label
      com.centurylinklabs.watchtower.enable: "false"

  # Trusted Docker API boundary for short-lived per-execution OpenCode runtimes.
  # It is not started by default and is the only service with the Docker socket.
  opencode-provisioner:
    profiles: [opencode-runtime]
    build:
      context: .
      dockerfile: docker/Dockerfile.opencode-provisioner
    image: ${IMAGE_PREFIX:-ghcr.io/all-the-rest/agent-tasks}/opencode-provisioner:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: ${COMPOSE_PROJECT_NAME:-agent-tasks}-opencode-provisioner
    restart: unless-stopped
    environment:
      OPENCODE_PROVISIONER_TOKEN: ${OPENCODE_PROVISIONER_TOKEN:-}
      OPENCODE_RUNTIME_IMAGE: ${IMAGE_PREFIX:-ghcr.io/all-the-rest/agent-tasks}/opencode:${IMAGE_TAG:-latest}
      OPENCODE_RUNTIME_MEMORY_LIMIT: ${OPENCODE_MEMORY_LIMIT:-1g}
      OPENCODE_RUNTIME_CPUS: ${OPENCODE_CPUS:-1.0}
      OPENCODE_RUNTIME_TTL_SECONDS: ${OPENCODE_RUNTIME_TTL_SECONDS:-2592000}
      PROVISIONER_CONTAINER_NAME: ${COMPOSE_PROJECT_NAME:-agent-tasks}-opencode-provisioner
      PROVISIONER_PUBLIC_URL: http://opencode-provisioner:4090
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [opencode-runtime]
    read_only: true
    tmpfs: [/tmp:size=64m,mode=1777]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 128
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4090/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 5s
    labels:
      <<: *stack-label
      com.centurylinklabs.watchtower.enable: "false"

  # Hardened browser execution: non-root, read-only root, no capabilities, no
  # published ports, its own throwaway filesystem and a process limit. The worker
  # reaches it over the internal backend network only.
  browser-runner:
    build:
      context: .
      dockerfile: docker/Dockerfile.runner
    image: ${IMAGE_PREFIX:-ghcr.io/all-the-rest/agent-tasks}/browser-runner:${IMAGE_TAG:-latest}
    pull_policy: build
    restart: unless-stopped
    environment:
      PORT: "8081"
      RUNNER_TOKEN: ${RUNNER_TOKEN:?set RUNNER_TOKEN in .env}
      RUNNER_ALLOW_HTTP: ${RUNNER_ALLOW_HTTP:-true}
      RUNNER_ALLOWED_PORTS: ${RUNNER_ALLOWED_PORTS:-80,443}
      RUNNER_MAX_SESSIONS: ${RUNNER_MAX_SESSIONS:-2}
      # Must exceed the longest task duration (limits.maxDurationSec, max 3600 s).
      # 3,660,000 ms leaves one minute for session cleanup.
      RUNNER_SESSION_TTL_MS: ${RUNNER_SESSION_TTL_MS:-3660000}
      # Keep the sandbox on by default. Hosts without user namespaces must opt out
      # explicitly (RUNNER_CHROMIUM_SANDBOX=false); startup logs the risk.
      RUNNER_CHROMIUM_SANDBOX: ${RUNNER_CHROMIUM_SANDBOX:-true}
    networks: [backend]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /dev/shm:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
      - seccomp=${RUNNER_SECCOMP_PATH:-docker/seccomp-browser.json}
    cap_drop: [ALL]
    # Chromium's user-namespace sandbox chroots into an empty directory after
    # unshare(CLONE_NEWUSER). The seccomp profile grants chroot only with
    # CAP_SYS_CHROOT, so the capability must be in the container's bounding set;
    # the browser process still runs as non-root with no effective capabilities.
    cap_add: [SYS_CHROOT]
    pids_limit: 256
    mem_limit: ${BROWSER_MEMORY_LIMIT:-1g}
    cpus: ${BROWSER_CPUS:-1.0}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      <<: *stack-label
      com.centurylinklabs.watchtower.enable: "false"

  # Optional, profile "mail": local SMTP sink for development and tests.
  # Mailpit's spam score comes from the SpamAssassin sidecar (sa-check API).
  mailpit:
    image: axllent/mailpit:v1.33
    restart: unless-stopped
    profiles: [mail]
    environment:
      MP_ENABLE_SPAMASSASSIN: spamassassin:783
      MP_MAX_MESSAGES: "500"
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_HTTP_PORT:-8025}:8025"
    networks: [backend]
    security_opt:
      - no-new-privileges:true
    labels:
      <<: *stack-label

  spamassassin:
    image: axllent/spamassassin:3
    restart: unless-stopped
    profiles: [mail]
    networks: [backend]
    security_opt:
      - no-new-privileges:true
    labels:
      <<: *stack-label

  # Optional, profile "search": self-hosted metasearch used for real web research.
  searxng:
    image: searxng/searxng:2026.10.30-ffa88e3ba
    restart: unless-stopped
    profiles: [search]
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ${SEARXNG_SETTINGS_PATH:-./docker/searxng/settings.yml}:/etc/searxng/settings.yml:ro
    networks: [backend]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    labels:
      <<: *stack-label

networks:
  backend:
    internal: false
  # OpenCode can reach the worker and configured inference endpoints, but not
  # Postgres, the API or the browser runner on the application backend network.
  opencode:
    internal: false
  opencode-runtime:
    name: ${COMPOSE_PROJECT_NAME:-agent-tasks}_opencode-runtime
    internal: false

volumes:
  postgres-data:
  codex-homes:
  opencode-data:
