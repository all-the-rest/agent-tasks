# nginx.conf for the read-only web container.
#
# nginxinc/nginx-unprivileged defaults to /tmp for the pid file and every temp
# path. compose.yaml mounts only /var/cache/nginx and /var/run as tmpfs, so the
# defaults fail with `read_only: true`. Every writable path below points at one
# of those mounts instead, which keeps the existing compose tmpfs list valid.
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Invitation links carry a single-use account-creation token in the path.
    # Never write it to the access log; only the shape is useful for operations.
    map $uri $safe_uri {
        ~^/invite/            /invite/***;
        ~^/api/invitations/   /api/invitations/***;
        default               $uri;
    }
    log_format main '$remote_addr - $remote_user [$time_local] "$request_method $safe_uri" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path       /var/cache/nginx/proxy_temp;
    fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
    scgi_temp_path        /var/cache/nginx/scgi_temp;

    sendfile on;
    keepalive_timeout 65;

    include /etc/nginx/conf.d/*.conf;
}
