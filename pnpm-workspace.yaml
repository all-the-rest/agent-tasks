packages:
  - apps/*
  - services/*
  - packages/*

# One place for the versions every workspace project shares (pnpm catalog).
allowBuilds:
  esbuild: true
  "@parcel/watcher": true # Its install hook is a no-op unless build_from_source=true; platform prebuilds are optional dependencies.

catalog:
  "@types/node": ^26.6.6
  drizzle-orm: ^0.45.4
  fastify: ^5.12.7
  pg: ^8.16.3
  pg-boss: ^12.38.0
  tsx: ^4.20.6
  tsup: ^9.0.0
  typescript: ^6.0.3
  vitest: ^5.0.5
  zod: ^4.6.7
