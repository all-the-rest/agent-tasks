packages:
  - apps/*
  - services/*
  - packages/*

# One place for the versions every workspace project shares (pnpm catalog).
allowBuilds:
  esbuild: true
  "@parcel/watcher": true # Its install hook is a no-op unless build_from_source=true; platform prebuilds are optional dependencies.

overrides:
  zod@3.25.76: 4.6.7

catalog:
  "@types/node": ^26.6.6
  drizzle-orm: ^0.45.4
  fastify: ^5.12.7
  pg: ^8.16.3
  pg-boss: ^12.38.0
  tsx: ^4.20.6
  tsup: ^9.0.0
  typescript: ^6.0.3
  vitest: ^5.0.5
  zod: ^4.6.7

auditConfig:
  # CVE-2026-112366 / picomatch ReDoS (High). Advisory lists "Patched versions:
  # None" and npm latest is 4.0.7, so no fixed release exists to bump to.
  # Reached only as a deep transitive dev dependency via @opencode/sdk.
  # Remove this entry once a fixed picomatch release is published.
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
