name: Feature request
description: Propose a new capability or an improvement to Agent Tasks
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the smallest change that would solve it.
        Please check the open issues and the roadmap before submitting.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard, missing or surprising today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should Agent Tasks behave? Include UI, API or deployment details if relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other designs you evaluated.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Scheduling and executions
        - Web UI
        - Providers and models
        - Web research and browser isolation
        - Authentication and multi-user isolation
        - Deployment and operations
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, mockups, related requirements or constraints.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
