name: CI

on:
  push:
    branches: [main]
    # Owner decision: docs-only pushes do not start the full pipeline. The local
    # pre-commit hook still scans staged files for secrets and runs ratchet, so
    # gitleaks and the rule-file gates are not lost on docs commits. Anything
    # outside docs/** and markdown still triggers every job.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '12.9.1'

jobs:
  lint-typecheck:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck every workspace project
        run: pnpm -r typecheck
      - name: Validate the deployment stacks
        run: |
          set -eu
          for stack in local e2e production; do
            sh deployment/stack.sh "$stack" config -q
            echo "validated deployment/compose.$stack.yaml"
          done
      - name: Check deployment scripts and compose parity
        run: |
          bash -n deployment/deploy.sh
          sh -n deployment/stack.sh
          sh -n scripts/test-deploy-dry-run.sh
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck -S warning deployment/deploy.sh deployment/stack.sh scripts/test-deploy-dry-run.sh .githooks/pre-commit
          DEPLOY_TEST_RENDER_COMPOSE=1 sh scripts/test-deploy-dry-run.sh
          node scripts/test-compose-parity.mjs
          node scripts/check-deploy-compose-contract.mjs
          node scripts/check-compose-parity.mjs

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test:unit
      - name: Web unit tests
        run: pnpm --filter @agent-tasks/web test
      - name: Read pinned ratchet version
        id: ratchet
        run: echo "version=v$(tr -d '[:space:]' < .ratchet-version)" >> "$GITHUB_OUTPUT"
      - name: Ratchet gates
        uses: all-the-rest/ratchet-cli@4cace52ac7731985130292ead6ae81d44b4d72d6
        with:
          mode: validate
          tier: fast
          version: ${{ steps.ratchet.outputs.version }}

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent_tasks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent_tasks"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://agent:agent@localhost:5432/agent_tasks
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium for the browser runner
        run: pnpm exec playwright install --with-deps chromium
      - name: Migrate the test database
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Integration tests
        run: pnpm test:integration
        env:
          TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate per-run secrets and a fixed setup token
        run: |
          SETUP_TOKEN="e2e-setup-$(openssl rand -hex 16)"
          ADMIN_PASSWORD="E2e-$(openssl rand -hex 12)"
          {
            echo "AUTH_SECRET=$(openssl rand -hex 32)"
            echo "SECRETS_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "RUNNER_TOKEN=$(openssl rand -hex 24)"
            echo "OPENCODE_PROVISIONER_TOKEN=$(openssl rand -hex 32)"
            # Deterministic memory/recommendation proposals for the E2E learning checks.
            echo "FAKE_RUNTIME_MEMORY_OPS=1"
            echo "PUBLIC_BASE_URL=http://localhost:8080"
            echo "COOKIE_SECURE=false"
            echo "SETUP_TOKEN=$SETUP_TOKEN"
            echo "E2E_SETUP_TOKEN=$SETUP_TOKEN"
            # Environment bootstrap: the stack creates this admin on start, so the
            # setup screen is skipped and the suite signs in with E2E_ADMIN_*.
            echo "ADMIN_EMAIL=e2e-admin@example.com"
            echo "ADMIN_PASSWORD=$ADMIN_PASSWORD"
            echo "ADMIN_NAME=E2E Admin"
            echo "E2E_ADMIN_EMAIL=e2e-admin@example.com"
            echo "E2E_ADMIN_PASSWORD=$ADMIN_PASSWORD"
            echo "ALLOW_REGISTRATION=false"
            # The suite plus the bootstrap check sign in several times per minute.
            echo "RATE_LIMIT_SIGNIN_MAX=100"
            echo "SMTP_URL=smtp://mailpit:1025"
            echo "E2E_BASE_URL=http://localhost:8080"
          } >> "$GITHUB_ENV"
      - name: Build and start the compose stack
        run: docker compose --profile search --profile mail up -d --build
      - name: Wait for the API health endpoint
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/healthz >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "API did not become healthy" >&2
          docker compose ps
          docker compose logs --no-color --tail=200
          exit 1
      - name: Assert the Chromium sandbox is enabled
        run: |
          set -euo pipefail
          status=$(docker compose exec -T browser-runner node -e "fetch('http://127.0.0.1:8081/healthz').then(r=>r.json()).then(j=>{if(!j.ok||j.sandbox!==true||!j.browserVersion)process.exit(1);console.log(j.sandbox+' '+j.browserVersion)}).catch(()=>process.exit(1))")
          echo "runner sandbox: $status"
          case "$status" in
            "true "*) ;;
            *) echo "Chromium did not start with its sandbox enabled" >&2; exit 1 ;;
          esac
      - name: Verify env bootstrap and registration setting
        run: node scripts/verify-env-bootstrap.mjs
      - name: Point the E2E mock provider at the Docker bridge gateway
        run: |
          gateway=$(docker network inspect agent-tasks_backend --format '{{(index .IPAM.Config 0).Gateway}}' 2>/dev/null || true)
          if [ -n "$gateway" ]; then
            echo "E2E_MOCK_BASE_URL=http://${gateway}:18099" >> "$GITHUB_ENV"
          else
            echo "No compose gateway found; the suite falls back to the host IPv4 address." >&2
          fi
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser E2E
        run: pnpm test:e2e
      - name: Verify parallel workers and crash recovery
        run: |
          # Only this check needs slow executions; keep the E2E suite fast by
          # recreating the fake runtime with the delay just for this step. Export
          # it for both Compose invocations: the scale-up below re-renders and
          # recreates the provisioner, and must not reset the delay to zero.
          export FAKE_RUNTIME_DELAY_MS=20000
          docker compose up -d --no-deps --wait opencode-test-provisioner
          # Keep the images built above instead of re-pulling published :latest.
          docker compose up -d --pull never --scale worker=2
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/healthz >/dev/null; then break; fi
            sleep 2
          done
          node scripts/verify-workers.mjs
      - name: Verify HTML mail and SpamAssassin score
        run: |
          email=$(docker compose exec -T postgres psql -U agent -d agent_tasks -tAc "select email from \"user\" where role = 'ADMIN' order by created_at limit 1" | tr -d '[:space:]')
          MAIL_TO="$email" API_BASE_URL=http://localhost:8080 MAILPIT_URL=http://localhost:8025 MAIL_ORIGIN=http://localhost:8080 node scripts/check-mailpit.mjs
      - name: Verify the mail in the Mailpit UI
        run: |
          email=$(docker compose exec -T postgres psql -U agent -d agent_tasks -tAc "select email from \"user\" where role = 'ADMIN' order by created_at limit 1" | tr -d '[:space:]')
          MAIL_TO="$email" MAILPIT_URL=http://localhost:8025 MAIL_UI_SCREENSHOT=mail-preview.png node scripts/verify-mail-ui.mjs
      - name: Upload the Mailpit preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mail-preview
          path: mail-preview.png
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Dump compose logs
        if: failure()
        run: docker compose logs --no-color --tail=500
      - name: Tear down the stack
        if: always()
        run: docker compose --profile search down -v

  docker:
    name: Build image ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: docker/Dockerfile.api
          - name: runner
            dockerfile: docker/Dockerfile.runner
          - name: opencode
            dockerfile: docker/Dockerfile.opencode
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: agent-tasks/${{ matrix.name }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Scan for committed secrets
        # The gitleaks CLI is MIT-licensed; the GitHub Action of the same name
        # requires a commercial licence for organisations.
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks detect --source . --no-git --redact --verbose
      - name: Scan the filesystem with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
