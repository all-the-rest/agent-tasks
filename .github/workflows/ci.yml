name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '12.9.1'

jobs:
  lint-typecheck:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck every workspace project
        run: pnpm -r typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test:unit
      - name: Web unit tests
        run: pnpm --filter @agent-tasks/web test
      - name: Install ratchet
        env:
          RATCHET_VERSION: '0.6.2'
        run: |
          set -euo pipefail
          asset="ratchet-${RATCHET_VERSION}-linux-x86_64.tar.gz"
          base="https://github.com/all-the-rest/ratchet-cli/releases/download/v${RATCHET_VERSION}"
          curl -fsSL --proto '=https' --tlsv1.2 -o "/tmp/${asset}" "${base}/${asset}"
          curl -fsSL --proto '=https' --tlsv1.2 -o /tmp/ratchet-checksums.txt "${base}/checksums.txt"
          (cd /tmp && grep " ${asset}$" ratchet-checksums.txt | sha256sum --check --strict -)
          tar -xzf "/tmp/${asset}" -C /tmp ratchet
          sudo install -m 0755 /tmp/ratchet /usr/local/bin/ratchet
          ratchet --version
      - name: Quality gates
        run: pnpm gates

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent_tasks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent_tasks"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://agent:agent@localhost:5432/agent_tasks
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium for the browser runner
        run: pnpm exec playwright install --with-deps chromium
      - name: Migrate the test database
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Integration tests
        run: pnpm test:integration
        env:
          TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate per-run secrets and a fixed setup token
        run: |
          SETUP_TOKEN="e2e-setup-$(openssl rand -hex 16)"
          {
            echo "AUTH_SECRET=$(openssl rand -hex 32)"
            echo "SECRETS_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "RUNNER_TOKEN=$(openssl rand -hex 24)"
            echo "PUBLIC_BASE_URL=http://localhost:8080"
            echo "COOKIE_SECURE=false"
            echo "SETUP_TOKEN=$SETUP_TOKEN"
            echo "E2E_SETUP_TOKEN=$SETUP_TOKEN"
            # GitHub's runner kernel forbids the Chromium sandbox inside the container.
            # The production default stays true (compose.yaml); the sandbox itself is
            # therefore NOT VERIFIED in CI.
            echo "RUNNER_CHROMIUM_SANDBOX=false"
            echo "E2E_BASE_URL=http://localhost:8080"
          } >> "$GITHUB_ENV"
      - name: Build and start the compose stack
        run: docker compose --profile search up -d --build
      - name: Wait for the API health endpoint
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/healthz >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "API did not become healthy" >&2
          docker compose ps
          docker compose logs --no-color --tail=200
          exit 1
      - name: Point the E2E mock provider at the Docker bridge gateway
        run: |
          gateway=$(docker network inspect agent-tasks_backend --format '{{(index .IPAM.Config 0).Gateway}}' 2>/dev/null || true)
          if [ -n "$gateway" ]; then
            echo "E2E_MOCK_BASE_URL=http://${gateway}:18099" >> "$GITHUB_ENV"
          else
            echo "No compose gateway found; the suite falls back to the host IPv4 address." >&2
          fi
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser E2E
        run: pnpm test:e2e
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Dump compose logs
        if: failure()
        run: docker compose logs --no-color --tail=500
      - name: Tear down the stack
        if: always()
        run: docker compose --profile search down -v

  docker:
    name: Build image ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: docker/Dockerfile.api
          - name: web
            dockerfile: docker/Dockerfile.web
          - name: runner
            dockerfile: docker/Dockerfile.runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: agent-tasks/${{ matrix.name }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Scan for committed secrets
        # The gitleaks CLI is MIT-licensed; the GitHub Action of the same name
        # requires a commercial licence for organisations.
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks detect --source . --no-git --redact --verbose
      - name: Scan the filesystem with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
