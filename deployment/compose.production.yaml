# Production stack, deployed by deployment/deploy.sh as the compose project
# `agent-tasks` in /opt/stacks/agent-tasks. This file is a deliberately vendored
# host snapshot, not an overlay of ../compose.yaml: it adds the proxy-owned
# external `webnet` and the fixed API address, omits `build`, and uses absolute
# host paths for the seccomp profile and optional SearXNG settings. The security
# invariants shared with ../compose.yaml are checked by
# scripts/check-compose-parity.mjs in CI.
#
# Critical values have no insecure fallback here. Secrets and host paths live in
# /opt/stacks/agent-tasks/.env (root:root 0600, host-only).
name: agent-tasks

# Every production service carries this label for docker ps/monitoring and for
# the host-side verification in deployment/README.md.
x-stack-label: &stack-label
  com.agent-tasks.stack: production

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-agent_tasks}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env}
  AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
  SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:?set SECRETS_ENCRYPTION_KEY in .env}
  # Optional when ADMIN_EMAIL/ADMIN_PASSWORD bootstrap the first admin.
  SETUP_TOKEN: ${SETUP_TOKEN:-}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  ADMIN_NAME: ${ADMIN_NAME:-Administrator}
  ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
  AGENT_TASKS_ENABLE_CODEX: ${AGENT_TASKS_ENABLE_CODEX:-0}
  SMTP_URL: ${SMTP_URL:-}
  SMTP_FROM: ${SMTP_FROM:-}
  SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
  COOKIE_SECURE: ${COOKIE_SECURE:?set COOKIE_SECURE in .env}
  RATE_LIMIT_API_MAX: ${RATE_LIMIT_API_MAX:-300}
  RATE_LIMIT_SIGNIN_MAX: ${RATE_LIMIT_SIGNIN_MAX:-5}
  RATE_LIMIT_SESSION_MAX: ${RATE_LIMIT_SESSION_MAX:-600}
  RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
  TRUST_PROXY: ${TRUST_PROXY:?set TRUST_PROXY in .env}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:17.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-agent_tasks}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent} -d ${POSTGRES_DB:-agent_tasks}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    labels:
      <<: *stack-label

  api:
    image: ${IMAGE_PREFIX:-ghcr.io/all-the-rest/agent-tasks}/api:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "true"
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      backend: {}
      webnet:
        ipv4_address: 172.18.0.70
    ports:
      # Loopback by default: the TLS proxy is the only public listener. Set
      # HTTP_BIND=0.0.0.0 only when the proxy runs on another host/container.
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    read_only: true
    tmpfs: [/tmp]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      <<: *stack-label
      com.centurylinklabs.watchtower.enable: "true"

  worker:
    image: ${IMAGE_PREFIX:-ghcr.io/all-the-rest/agent-tasks}/api:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    command: ["node", "apps/worker/dist/index.js"]
    environment:
      <<: *app-env
      RUNNER_URL: http://browser-runner:8081
      RUNNER_TOKEN: ${RUNNER_TOKEN:?set RUNNER_TOKEN in .env}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      OPENCODE_PROVISIONER_URL: http://opencode-provisioner:4090
      OPENCODE_PROVISIONER_TOKEN: ${OPENCODE_PROVISIONER_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      browser-runner:
        condition: service_started
    networks: [backend, opencode-runtime]
    read_only: true
    tmpfs: [/tmp]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    labels:
      <<: *stack-label
      com.centurylinklabs.watchtower.enable: "true"
    stop_grace_period: 40s

  # The real provisioner is profile-gated. Worker startup requires its endpoint
  # and token before registering queues; keep this inactive until verification.
  opencode-provisioner:
    profiles: [opencode-runtime]
    image: ${IMAGE_PREFIX:-ghcr.io/all-the-rest/agent-tasks}/opencode-provisioner:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: ${COMPOSE_PROJECT_NAME:-agent-tasks}-opencode-provisioner
    restart: unless-stopped
    environment:
      OPENCODE_PROVISIONER_TOKEN: ${OPENCODE_PROVISIONER_TOKEN:-}
      OPENCODE_RUNTIME_IMAGE: ${IMAGE_PREFIX:-ghcr.io/all-the-rest/agent-tasks}/opencode:${IMAGE_TAG:-latest}
      OPENCODE_RUNTIME_MEMORY_LIMIT: ${OPENCODE_MEMORY_LIMIT:-1g}
      OPENCODE_RUNTIME_CPUS: ${OPENCODE_CPUS:-1.0}
      OPENCODE_RUNTIME_TTL_SECONDS: ${OPENCODE_RUNTIME_TTL_SECONDS:-2592000}
      PROVISIONER_CONTAINER_NAME: ${COMPOSE_PROJECT_NAME:-agent-tasks}-opencode-provisioner
      PROVISIONER_PUBLIC_URL: http://opencode-provisioner:4090
      # Worker-hosted MCP bridge; the runtime reaches it only through this proxy.
      TOOL_BRIDGE_URL: http://worker:4091/mcp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [opencode-runtime, opencode-egress]
    read_only: true
    # Block form: flow style would split `size=...,mode=...` into list items and
    # Docker then rejects `mode=1777` as a mount path.
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 128
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4090/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 5s
    labels:
      <<: *stack-label
      com.centurylinklabs.watchtower.enable: "false"

  # Hardened browser execution: non-root, read-only root, no capabilities, no
  # published ports, its own throwaway filesystem and a process limit. The worker
  # reaches it over the internal backend network only.
  browser-runner:
    image: ${IMAGE_PREFIX:-ghcr.io/all-the-rest/agent-tasks}/browser-runner:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      PORT: "8081"
      RUNNER_TOKEN: ${RUNNER_TOKEN:?set RUNNER_TOKEN in .env}
      RUNNER_ALLOW_HTTP: ${RUNNER_ALLOW_HTTP:-true}
      RUNNER_ALLOWED_PORTS: ${RUNNER_ALLOWED_PORTS:-80,443}
      RUNNER_MAX_SESSIONS: ${RUNNER_MAX_SESSIONS:-2}
      # Must exceed the longest task duration (limits.maxDurationSec, max 3600 s).
      # 3,660,000 ms leaves one minute for session cleanup.
      RUNNER_SESSION_TTL_MS: ${RUNNER_SESSION_TTL_MS:-3660000}
      # Keep the sandbox on by default. Hosts without user namespaces must opt out
      # explicitly (RUNNER_CHROMIUM_SANDBOX=false); startup logs the risk.
      RUNNER_CHROMIUM_SANDBOX: ${RUNNER_CHROMIUM_SANDBOX:-true}
    networks: [backend]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /dev/shm:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
      # Read by the Docker daemon before the container starts. deploy.sh ships
      # the repository profile to this absolute host path; .env may override it.
      - seccomp=${RUNNER_SECCOMP_PATH:-/opt/stacks/agent-tasks/docker/seccomp-browser.json}
    cap_drop: [ALL]
    # Chromium's user-namespace sandbox chroots into an empty directory after
    # unshare(CLONE_NEWUSER). The seccomp profile grants chroot only with
    # CAP_SYS_CHROOT, so the capability must be in the container's bounding set;
    # the browser process still runs as non-root with no effective capabilities.
    cap_add: [SYS_CHROOT]
    pids_limit: 256
    mem_limit: ${BROWSER_MEMORY_LIMIT:-1g}
    cpus: ${BROWSER_CPUS:-1.0}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      <<: *stack-label
      com.centurylinklabs.watchtower.enable: "false"

  # Optional, profile "mail": local SMTP sink for development and tests.
  # Mailpit's spam score comes from the SpamAssassin sidecar (sa-check API).
  mailpit:
    image: axllent/mailpit:v1.33
    restart: unless-stopped
    profiles: [mail]
    environment:
      MP_ENABLE_SPAMASSASSIN: spamassassin:783
      MP_MAX_MESSAGES: "500"
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_HTTP_PORT:-8025}:8025"
    networks: [backend]
    security_opt:
      - no-new-privileges:true
    labels:
      <<: *stack-label

  spamassassin:
    image: axllent/spamassassin:3
    restart: unless-stopped
    profiles: [mail]
    networks: [backend]
    security_opt:
      - no-new-privileges:true
    labels:
      <<: *stack-label

  # Optional, profile "search": self-hosted metasearch used for real web research.
  searxng:
    image: searxng/searxng:2026.10.30-ffa88e3ba
    restart: unless-stopped
    profiles: [search]
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      # Host-only file with a generated server.secret_key. deploy.sh never ships
      # the repository placeholder; preflight requires this file only while the
      # search profile is active.
      - ${SEARXNG_SETTINGS_PATH:-/opt/stacks/agent-tasks/docker/searxng/settings.yml}:/etc/searxng/settings.yml:ro
    networks: [backend]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    labels:
      <<: *stack-label

networks:
  backend:
    internal: false
  # Prerequisite owned by the Caddy/proxy stack, not by this Compose project.
  # Internal worker/provisioner traffic. Only the profile-gated provisioner
  # gets the separate provider-egress network.
  opencode-runtime:
    name: ${COMPOSE_PROJECT_NAME:-agent-tasks}_opencode-runtime
    internal: true
  opencode-egress:
    internal: false
  webnet:
    external: true
    name: webnet

volumes:
  postgres-data:
  codex-homes:
  opencode-data:
