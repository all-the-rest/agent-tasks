# Gitleaks configuration.
#
# The deterministic test fixtures intentionally contain fake tokens (the redaction
# tests must exercise a realistic-looking value). They are allowlisted by path so a
# real leak anywhere else still fails the scan.

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic credentials in tests and fixtures"
paths = [
  '''apps/api/test/log-redaction\.test\.ts''',
  '''packages/.*/test/.*''',
  '''test/.*''',
  '''e2e/.*''',
]

[[allowlists]]
description = "replace-with-* placeholders in the committed deployment templates"
regexTarget = "secret"
regexes = ['''^replace-with-[a-z0-9-]+$''']
